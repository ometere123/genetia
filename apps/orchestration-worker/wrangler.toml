name = "genetia-orchestration"
main = "build/worker.js"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

[vars]
GENLAYER_RPC = "https://studio-dev.genlayer.com/api"
MARKET_ADMISSIBILITY_ADDRESS = "0x8DeD1d978f70E321ADce704aF95a50314A225757"
BASE_RPC = "https://base-sepolia-rpc.publicnode.com"
BASE_DEPLOYMENT_BLOCK = "46703768"

[[queues.producers]]
binding = "GENETIA_JOBS"
queue = "genetia-work-items"

[[queues.consumers]]
queue = "genetia-work-items"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "genetia-work-items-dlq"

[[queues.producers]]
binding = "GENETIA_DLQ"
queue = "genetia-work-items-dlq"

[[workflows]]
name = "genetia-lifecycle"
binding = "GENETIA_WORKFLOWS"
class_name = "GenetiaLifecycleWorkflow"

[[hyperdrive]]
binding = "GENETIA_DB"
id = "5fb45c6d4ba044c9b499845a316b5fc6"

