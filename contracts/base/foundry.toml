[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
